plugins { id 'net.neoforged.moddev' version '2.0.148' }
version = '1.2.0'
group = 'mix.cinematiczoom'
def targets = [
    '1.21.1': ['21.1.264','15.0.140',21],
    '1.21.2': ['21.2.1-beta','16.0.143',21],
    '1.21.5': ['21.5.101','18.0.145',21],
    '1.21.7': ['21.7.25-beta','19.0.147',21],
    '1.21.11':['21.11.48','21.11.153',21],
    '26.1':['26.1.0.19-beta','26.1.154',25],
    '26.2':['26.2.0.93','26.2.155',25],
    '26.3':['26.3.0.95','26.3.159',25]
]
ext.mcTarget = findProperty('mc') ?: '1.21.11'
def target = targets[mcTarget]
if (!target) throw new GradleException("Unknown NeoForge target ${mcTarget}")
layout.buildDirectory = file("build/${mcTarget}")
base { archivesName = "cinematic-zoom-extended-${mcTarget}-neoforge" }
java { toolchain.languageVersion = JavaLanguageVersion.of(target[2]); withSourcesJar() }
neoForge {
    enable { version = target[0]; disableRecompilation = true }
    runs { client { client(); gameDirectory = file("runs/${mcTarget}") } }
    mods { cinematiczoom_extended { sourceSet sourceSets.main } }
}
repositories { maven { url = 'https://maven.shedaniel.me/' } }
dependencies { implementation "me.shedaniel.cloth:cloth-config-neoforge:${target[1]}" }
def generated = layout.buildDirectory.dir('generated/adapter')
def adapter = tasks.register('generateAdapter', Sync) {
    from 'src/main/java'
    into generated
    inputs.property 'target', mcTarget
    doLast {
        fileTree(generated).matching { include '**/*.java' }.each { file ->
            def code = file.text
            if (mcTarget in ['1.21.1','1.21.2','1.21.5','1.21.7']) {
                code = code.replace('Identifier','ResourceLocation')
                code = code.replace('private static final KeyMapping.Category CATEGORY=new KeyMapping.Category(ResourceLocation.parse("cinematiczoom:main"));', 'private static final String CATEGORY="key.categories.cinematiczoom";')
                code = code.replace('event.registerCategory(CATEGORY);','')
            }
            if (mcTarget.startsWith('26.')) code = code.replace('GuiGraphics','GuiGraphicsExtractor')
            if (mcTarget in ['26.2','26.3']) code = code.replace('client.screen','client.gui.screen()').replace('Minecraft.getInstance().screen','Minecraft.getInstance().gui.screen()')
            if (mcTarget == '26.3') {
                code = code.replace('code,CATEGORY','com.mojang.blaze3d.platform.InputConstants.Type.KEYBOARD,code,CATEGORY')
                ['67':'C','86':'V','265':'UP','264':'DOWN','263':'LEFT','262':'RIGHT'].each { number, key ->
                    code = code.replace(",${number},event", ",com.mojang.blaze3d.platform.InputConstants.KEY_${key},event")
                }
            }
            file.text = code
        }
    }
}
sourceSets.main.java.setSrcDirs([generated, file('../../src/common/java')])
tasks.named('compileJava') { dependsOn adapter }
tasks.named('sourcesJar') { dependsOn adapter }
sourceSets.main.resources.srcDir '../../src/main/resources'
processResources {
    inputs.property 'minecraft', mcTarget
    inputs.property 'loader', target[0]
    inputs.property 'cloth', target[1]
    filesMatching('META-INF/neoforge.mods.toml') { expand minecraft: mcTarget, loader: target[0], cloth: target[1], modVersion: project.version }
}
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
jar { from('../../LICENSE') }
apply from: '../client-tests.gradle'
