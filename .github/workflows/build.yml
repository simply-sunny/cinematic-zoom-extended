name: Multi-loader verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge, neoforge]
        minecraft: ['1.20.1', '1.21.1', '1.21.2', '1.21.5', '1.21.7', '1.21.11', '26.1', '26.2', '26.3']
        exclude:
          - loader: forge
            minecraft: '1.21.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test target
        env:
          LOADER: ${{ matrix.loader }}
          MC: ${{ matrix.minecraft }}
        run: |
          TOOLCHAINS='-Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64'
          if [ "$LOADER" = fabric ]; then
            ./gradlew :test ":$MC:build" "$TOOLCHAINS"
          elif [ "$MC" = 1.20.1 ]; then
            EXTRA=()
            if [ "$LOADER" = neoforge ]; then EXTRA+=(-PlegacyNeo); fi
            ./gradlew -p platform/forge-1.20.1 build "${EXTRA[@]}" "$TOOLCHAINS"
          else
            ./gradlew -p "platform/$LOADER" build "-Pmc=$MC" "$TOOLCHAINS"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cinematiczoom-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.minecraft }}/build/libs/*.jar
            platform/**/build/**/libs/*.jar
          if-no-files-found: error
